# Part 4: deploy semua service dengan Docker Compose.
#
#   docker compose up -d --build                      → full stack: 2 database + RabbitMQ + core + payment + gateway
#   docker compose up -d core-db payment-db rabbitmq  → infrastruktur saja (untuk `go run` lokal)
#   docker ps                                         → core-service & payment-service harus "Up ... (healthy)"
#
# Dari luar, yang dibuka hanya: gateway (:8080), database (untuk DBeaver), dan RabbitMQ (:5672 AMQP, :15672 dashboard).
# core-service dan payment-service tidak punya `ports`, jadi /internal/... tidak bisa diakses dari laptop/internet.
# Healthcheck core-service dan payment-service didefinisikan di Dockerfile masing-masing (`/app -healthcheck`).
#
# Secret (JWT_SECRET, INTERNAL_API_KEY) dibaca dari file .env di folder ini (lihat .env.example).

services:
  core-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: core_db
    ports:
      - "${CORE_DB_PORT:-5433}:5432"
    volumes:
      - core-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d core_db"]
      interval: 2s
      timeout: 3s
      retries: 30

  payment-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: payment_db
    ports:
      - "${PAYMENT_DB_PORT:-5434}:5432"
    volumes:
      - payment-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payment_db"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Message broker. Dashboard: http://localhost:15672 (guest / guest)
  rabbitmq:
    image: rabbitmq:3.13-management
    hostname: rabbitmq # data RabbitMQ disimpan per hostname; dibuat tetap supaya volume tetap terpakai
    ports:
      - "5672:5672" # AMQP, untuk aplikasi
      - "15672:15672" # dashboard web
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq # queue durable + pesan persistent tetap ada setelah container dibuat ulang
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  core-service:
    build: ./core-service # memakai core-service/Dockerfile
    environment:
      APP_PORT: "8081"
      DB_HOST: core-db # nama service = hostname di jaringan compose
      DB_PORT: "5432" # port DI DALAM jaringan, bukan 5433
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: core_db
      DB_SSLMODE: disable
      JWT_SECRET: ${JWT_SECRET:-}
      TOKEN_TTL: ${TOKEN_TTL:-24h}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      GIN_MODE: release
    depends_on:
      core-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  payment-service:
    build: ./payment-service # memakai payment-service/Dockerfile
    environment:
      APP_PORT: "8082"
      DB_HOST: payment-db
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: payment_db
      DB_SSLMODE: disable
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      CORE_SERVICE_URL: http://core-service:8081
      CORE_HTTP_TIMEOUT: ${CORE_HTTP_TIMEOUT:-5s}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      PAYMENT_TTL: ${PAYMENT_TTL:-10m}
      PAYMENT_PROCESSING_DELAY: ${PAYMENT_PROCESSING_DELAY:-2s}
      PAYMENT_RETRY_DELAY: ${PAYMENT_RETRY_DELAY:-10s}
      GIN_MODE: release
    depends_on:
      payment-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      core-service:
        condition: service_healthy # tunggu core benar-benar siap menerima debit
    restart: unless-stopped

  api-gateway:
    build: ./api-gateway
    environment:
      APP_PORT: "8080"
      CORE_SERVICE_URL: http://core-service:8081
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      core-service:
        condition: service_healthy
    restart: unless-stopped

volumes:
  core-db-data:
  payment-db-data:
  rabbitmq-data:
